name: Verify namespaces

# Two independent checks over the namespaces configured in rune-config.yml,
# running in parallel:
#
#   readonly-namespaces - fails when a read-only namespace is changed by hand.
#   annotate-generated  - reports, without failing, when a namespace carrying an
#                         `origin` marker is changed. Those namespaces are
#                         generated by an importer and are meant to be refined.
#
# In production the annotation belongs inside the reusable rune-dsl workflow
# alongside the read-only check, so that model repositories inherit it without
# changing anything. It is a separate job here only because this repository
# cannot modify the upstream reusable workflow.
#
# For more info, see https://rune.finos.org/docs/developers/read-only-namespaces

on:
  pull_request:
    paths:
      - "**/*.rosetta"
      - "rosetta-source/src/main/resources/rune-config.yml"
      - ".github/workflows/verify-readonly-namespaces.yml"
      - ".github/scripts/annotate_generated_namespaces.py"

jobs:
  readonly-namespaces:
    uses: finos/rune-dsl/.github/workflows/verify-readonly-namespaces.yml@main
    with:
      config-path: rosetta-source/src/main/resources/rune-config.yml
      root: rosetta-source/src/main/rosetta

  annotate-generated:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so HEAD can be diffed against the base ref.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve base ref
        id: base
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"

      - name: Annotate generated namespaces
        shell: bash
        run: |
          python .github/scripts/annotate_generated_namespaces.py \
            --base "${{ steps.base.outputs.ref }}" \
            --config rosetta-source/src/main/resources/rune-config.yml \
            --root rosetta-source/src/main/rosetta
