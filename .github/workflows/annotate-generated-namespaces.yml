name: Annotate generated namespaces

# Reports, in the pull request itself, which importer-generated Rune namespaces
# a change touches. Generated namespaces are those whose `namespaceConfig` entry
# carries an `origin` marker.
#
# Unlike `verify-readonly-namespaces`, this check never fails: generated
# namespaces are meant to be refined by hand. It annotates so the edit is
# visible to a reviewer, without a bypass label that would be applied to nearly
# every pull request and so mean nothing.

on:
  pull_request:
    paths:
      - "**/*.rosetta"
      - "rosetta-source/src/main/resources/rune-config.yml"
      - ".github/workflows/annotate-generated-namespaces.yml"
      - ".github/scripts/annotate_generated_namespaces.py"

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so HEAD can be diffed against the base ref.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve base ref
        id: base
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"

      - name: Annotate generated namespaces
        shell: bash
        run: |
          python .github/scripts/annotate_generated_namespaces.py \
            --base "${{ steps.base.outputs.ref }}" \
            --config rosetta-source/src/main/resources/rune-config.yml \
            --root rosetta-source/src/main/rosetta
